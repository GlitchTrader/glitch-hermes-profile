name: Finalize GHP-003 intelligence-first release

on:
  push:
    branches:
      - fix/ghp-003-intelligence-first

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ghp-003-intelligence-first
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate distribution integrity and finalize ledger evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          sums_path = Path("SHA256SUMS")
          paths = []
          for line in sums_path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              _, path = line.split(None, 1)
              paths.append(path.strip())
          rows = []
          for raw in paths:
              path = Path(raw)
              if not path.is_file():
                  raise SystemExit(f"distribution file missing: {raw}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest().upper()
              rows.append(f"{digest}  {raw}")
          sums_path.write_text("\n".join(rows) + "\n", encoding="utf-8")

          ledger_path = Path("docs/ledger/ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          row = next(item for item in ledger["items"] if item["id"] == "GHP-003")
          row["status"] = "done"
          row["evidence"] = [
              "SOUL.md and glitch-trade-mnq now define evidence-neutral probabilistic judgment with packet/user-configured authority.",
              "glitch-market-structure retains vocabulary while removing playbooks, fixed recipes, and unverified base rates.",
              "glitch-build-intent preserves strict intent shape and forbids replacing the chosen intent with an unrelated strategy.",
              "tests/test_intelligence_first_contract.py and the full profile test suite pass.",
              "Profile distribution version 0.0.2.20 has regenerated SHA256SUMS."
          ]
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Verify profile contracts
        run: |
          python -m py_compile scripts/*.py plugins/glitch-control/__init__.py
          python -m unittest discover -s tests -p 'test_*.py'
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for line in Path('SHA256SUMS').read_text(encoding='utf-8').splitlines():
              expected, raw = line.split(None, 1)
              path = Path(raw.strip())
              actual = hashlib.sha256(path.read_bytes()).hexdigest().upper()
              if actual != expected:
                  raise SystemExit(f'hash mismatch: {path}')
          print('distribution integrity valid')
          PY
      - name: Commit verified release metadata and remove this one-shot workflow
        run: |
          rm .github/workflows/ghp003-finalize.yml
          git config user.name "glitch-profile-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add SHA256SUMS docs/ledger/ledger.json .github/workflows/ghp003-finalize.yml
          git commit -m "chore(profile): finalize intelligence-first release metadata"
          git push origin HEAD:fix/ghp-003-intelligence-first

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python source and tests
        run: |
          python -m py_compile scripts/*.py plugins/glitch-control/__init__.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Distribution integrity
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          for line in Path("SHA256SUMS").read_text(encoding="utf-8-sig").splitlines():
              if not line.strip():
                  continue
              expected, raw_path = line.split(None, 1)
              path = Path(raw_path.strip())
              if not path.is_file():
                  raise SystemExit(f"distribution file missing: {path}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest().upper()
              if actual != expected.upper():
                  raise SystemExit(f"hash mismatch: {path}")
          print("distribution integrity valid")
          PY
      - name: Ledger validity
        run: python -m json.tool docs/ledger/ledger.json >/dev/null
